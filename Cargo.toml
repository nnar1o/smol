[package]
name = "smol"
version = "0.4.0"
edition = "2024"
description = "Smart Minimal Output Logger — run commands and get summarized output for LLMs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
libc = "0.2"
indicatif = "0.17"

[[bin]]
name = "smol-mcp"
path = "src/bin/smol-mcp.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[test]]
name = "cli_test"
path = "tests/e2e/cli_test.rs"

