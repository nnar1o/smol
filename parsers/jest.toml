name = "jest"
description = "Jest test runner output parser"

[detection]
command_prefix = "jest"

[detection.heuristic]
regex = "^(PASS|FAIL)\\s|Tests:\\s+\\d+"
min_lines = 3

ignore_patterns = [
    "^\\(?\\s*\\d+s$",
    "^Tests:\\s+",
    "^Snapshots:\\s+",
    "^Time:\\s+",
    "^Ran all test suites",
    "^\\s*at\\s+",
    "^\\s*$",
]

[[error_patterns]]
regex = "^FAIL\\s+(?P<message>.*)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^\\s*●\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^\\s*Expected:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^\\s*Received:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^\\s*at\\s+"
severity = "error"

[[warning_patterns]]
regex = "^\\s*(?:WARN|warn)\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "^PASS\\s", group = "message" },
    { regex = "Tests:\\s+\\d+ passed", group = "message" },
]
failure = [
    { regex = "^FAIL\\s", group = "message" },
    { regex = "Tests:\\s+\\d+ failed", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
