name = "tsc"
description = "TypeScript compiler output parser"

[detection]
command_prefix = "tsc"

[detection.heuristic]
regex = "error TS\\d+:|warning TS\\d+:|Found \\d+ error"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^(?P<file>.+?)\\((?P<line>\\d+),(?P<column>\\d+)\\):\\s+error\\s+TS\\d+:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^error\\s+TS\\d+:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?)\\((?P<line>\\d+),(?P<column>\\d+)\\):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^(?P<file>.+?)\\((?P<line>\\d+),(?P<column>\\d+)\\):\\s+warning\\s+TS\\d+:\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?)\\((?P<line>\\d+),(?P<column>\\d+)\\):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "^$", group = "message" },
]
failure = [
    { regex = "Found \\d+ error", group = "message" },
    { regex = "error TS\\d+:", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
