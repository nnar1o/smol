name = "npm"
description = "npm/Node.js package manager output parser"

[detection]
command_prefix = "npm"

[detection.heuristic]
regex = "npm (ERR|WARN|notice|verbose|http)"
min_lines = 1

ignore_patterns = [
    "^npm (notice|verbose|http|timing) .+$",
    "^npm info .+$",
    "^\\s*$",
    "^\\|+\\s*$",
    "added \\d+ package",
    "removed \\d+ package",
    "audited \\d+ package",
]

[[error_patterns]]
regex = "^npm ERR!\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^ERR!\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^npm error:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^npm ERR! code [A-Z_]+$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^npm WARN\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^WARN\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "found \\d+ vulnerabilities", group = "message" },
    { regex = "up to date", group = "message" },
    { regex = "added \\d+ package", group = "message" },
]
failure = [
    { regex = "^npm ERR!", group = "message" },
    { regex = "^npm error:", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
