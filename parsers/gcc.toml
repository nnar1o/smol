name = "gcc"
description = "GCC/Clang C/C++ compiler output parser"

[detection]
command_prefix = "gcc"

[detection.heuristic]
regex = ": error:"
min_lines = 1

ignore_patterns = []

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+fatal error:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "collect2: error: (?P<message>.+)$"
severity = "error"
is_fatal = true

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "^$", group = "message" },
]
failure = [
    { regex = "compilation terminated", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
