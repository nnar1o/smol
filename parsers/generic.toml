name = "generic"
description = "Generic fallback parser for unknown commands"

[detection]
# No command_prefix — this is the fallback when nothing else matches

[detection.heuristic]
regex = "(?i)(error|fail|warning|traceback)"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^(.+?):(\\d+):(\\d+):\\s+error:\\s+(?P<message>.*)$"
severity = "error"
file_group = "1"
line_group = "2"
column_group = "3"

[[error_patterns]]
regex = "^(.+?):(\\d+):\\s+error:\\s+(?P<message>.*)$"
severity = "error"
file_group = "1"
line_group = "2"

[[error_patterns]]
regex = "^(?:\\[)?\\s*(?:ERROR|Error|error|FATAL|fatal)\\b[\\]:]?\\s*(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(.*\\b)?(?:FAIL|Failed|failure|FAILURE)\\b(?P<message>.*)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^error\\[E\\d+\\]:\\s*(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^Traceback \\(most recent call last\\)"
severity = "error"

[[warning_patterns]]
regex = "^(.+?):(\\d+):(\\d+):\\s+warning:\\s+(?P<message>.*)$"
severity = "warning"
file_group = "1"
line_group = "2"
column_group = "3"

[[warning_patterns]]
regex = "^(.+?):(\\d+):\\s+warning:\\s+(?P<message>.*)$"
severity = "warning"
file_group = "1"
line_group = "2"

[[warning_patterns]]
regex = "^(?:\\[)?\\s*(?:WARNING|Warning|warning|WARN|warn)\\b[\\]:]?\\s*(?P<message>.+)$"
severity = "warning"

[status_patterns]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
