name = "grep"
description = "grep/rg text search output parser"

[detection]
command_prefix = "grep"

[detection.heuristic]
regex = "Binary matches|Segmentation fault"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^grep:\\s+(?P<file>.+?):\\s+(?P<message>memory exhausted)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^grep:\\s+(?P<file>.+?):\\s+(?P<message>Permission denied)$"
severity = "error"

[[error_patterns]]
regex = "^grep:\\s+(?P<file>.+?):\\s+(?P<message>No such file or directory)$"
severity = "error"

[[error_patterns]]
regex = "^grep:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<message>Segmentation fault)"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^Binary file\\s+(?P<file>.+?)\\s+matches$"
severity = "error"

[status_patterns]
success = [
    { regex = "^$", group = "message" },
]
failure = [
    { regex = "memory exhausted", group = "message" },
    { regex = "Segmentation fault", group = "message" },
    { regex = "Permission denied", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
