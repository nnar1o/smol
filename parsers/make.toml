name = "make"
description = "Make/CMake build output parser"

[detection]
command_prefix = "make"

[detection.heuristic]
regex = "^\\[\\d+%\\]|^make\\[\\d+\\]:"
min_lines = 2

ignore_patterns = [
    "^make\\[\\d+\\]: Entering directory\\s+.+$",
    "^make\\[\\d+\\]: Leaving directory\\s+.+$",
    "^make\\[\\d+\\]: Nothing to be done for\\s+.+$",
    "^\\s*$",
]

[[error_patterns]]
regex = "^make\\[\\d+\\]: \\*\\*\\*\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^make: \\*\\*\\*\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^Error:\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "Nothing to be done", group = "message" },
]
failure = [
    { regex = ":\\s+Error \\d+", group = "message" },
    { regex = "make\\[\\d+\\]: \\*\\*\\*", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
