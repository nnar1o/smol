name = "go"
description = "Go compiler/build output parser"

[detection]
command_prefix = "go"

[detection.heuristic]
regex = "^(# |can't load|cannot find|undefined:)"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^cannot find package\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^undefined:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^cannot use\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^\\s*#\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "^$", group = "message" },
]
failure = [
    { regex = "build failed", group = "message" },
    { regex = "cannot find package", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
