name = "git"
description = "Git output parser"

[detection]
command_prefix = "git"

[detection.heuristic]
regex = "^\\*(?: |$)"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^fatal:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^error:\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "^$", group = "message" },
]
failure = [
    { regex = "^fatal:", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
