name = "maven"
description = "Apache Maven build output parser"

[detection]
command_prefix = "mvn"

[detection.heuristic]
regex = "\\[INFO\\]"
min_lines = 5

ignore_patterns = [
    "^\\[INFO\\] --- .+ ---$",
    "^\\[INFO\\] ------------------------------------------------------------------------",
    "^Downloading from .+",
    "^Downloaded from .+",
    "^Progress",
    "^\\[INFO\\] reactor",
    "^\\[INFO\\] Reactor",
]

[[error_patterns]]
regex = "^\\[ERROR\\]\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "BUILD FAILURE"
severity = "error"
is_fatal = true

[[warning_patterns]]
regex = "^\\[WARNING\\]\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "BUILD SUCCESS", group = "message" },
]
failure = [
    { regex = "BUILD FAILURE", group = "message" },
]

[[test_patterns]]
# Maven Surefire/Failsafe test summary
# e.g. "Tests run: 120, Failures: 3, Errors: 0, Skipped: 5"
summary_regex = "Tests run:\\s*(?P<total>\\d+),\\s*Failures:\\s*(?P<failures>\\d+),\\s*Errors:\\s*(?P<errors>\\d+),\\s*Skipped:\\s*(?P<skipped>\\d+)"
# Individual test failures: e.g. "  com.example.MyTest > testMethod"
failure_regex = "(?P<suite>[\\w.]+)\\s+>\\s+(?P<test>\\w+)"

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
