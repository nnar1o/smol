name = "maven"
description = "Apache Maven build output parser"

[detection]
command_prefix = "mvn"

[detection.heuristic]
regex = "\\[INFO\\]"
min_lines = 5

ignore_patterns = [
    "^\\[INFO\\] --- .+ ---$",
    "^\\[INFO\\] ------------------------------------------------------------------------",
    "^Downloading from .+",
    "^Downloaded from .+",
    "^Progress",
    "^\\[INFO\\] reactor",
    "^\\[INFO\\] Reactor",
]

[[error_patterns]]
regex = "^\\[ERROR\\]\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "BUILD FAILURE"
severity = "error"
is_fatal = true

[[warning_patterns]]
regex = "^\\[WARNING\\]\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "BUILD SUCCESS", group = "message" },
]
failure = [
    { regex = "BUILD FAILURE", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
