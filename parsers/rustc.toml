name = "rustc"
description = "Rust compiler (rustc) output parser"

[detection]
command_prefix = "rustc"

[detection.heuristic]
regex = "error\\[E\\d+\\]:|error:"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
    "^\\s*\\|",
    "^\\s*$",
]

[[error_patterns]]
regex = "^error\\[E\\d+\\]:\\s*(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error\\[E\\d+\\]:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^error: (?P<message>.+)$"
severity = "error"
is_fatal = true

[[warning_patterns]]
regex = "^warning\\[E\\d+\\]:\\s*(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^warning: (?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = []
failure = [
    { regex = "^error: aborting", group = "message" },
    { regex = "could not compile", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
