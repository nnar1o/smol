name = "yarn"
description = "Yarn/PNPM package manager output parser"

[detection]
command_prefix = "yarn"

[detection.heuristic]
regex = "yarn (install|add|remove|upgrade|run|build|test)"
min_lines = 1

ignore_patterns = [
    "^\\[\\d+/\\d+\\] .+$",
    "^yarn install v",
    "^\\[\\d+:\\d+:\\d+\\]",
    "^\\s*$",
    "^Done in .+$",
    "^info .+$",
]

[[error_patterns]]
regex = "^ERROR\\b(?P<message>.*)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^error Command failed\\b(?P<message>.*)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^error\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^Error:\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^warning\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^Warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "Done in", group = "message" },
    { regex = "success Saved", group = "message" },
]
failure = [
    { regex = "error Command failed", group = "message" },
    { regex = "Process exited with code", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
