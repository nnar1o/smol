name = "cmake"
description = "CMake build system configure/build output parser"

[detection]
command_prefix = "cmake"

[detection.heuristic]
regex = "(CMake (Error|Warning) at|Configuring done|Generating done|cmake --build)"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
    "^-- .+$",
    "^\\[\\s*\\d+%\\].+$",
    "^Configuring done",
    "^Generating done",
    "^Build files have been written",
    "^Scanning dependencies",
    "^Linking ",
    "^Built target ",
]

[[error_patterns]]
regex = "^CMake Error at\\s+(?P<file>.+?):(?P<line>\\d+)"
severity = "error"

[[error_patterns]]
regex = "^CMake Error:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^(?P<message>\\w+ not found|Could not find .+)$"
severity = "error"

[[warning_patterns]]
regex = "^CMake Warning at\\s+(?P<file>.+?):(?P<line>\\d+)\\s*\\((?P<message>[^)]+)\\)\\s*$"
severity = "warning"

[[warning_patterns]]
regex = "^CMake Warning \\(dev\\):\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^CMake Warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "Configuring done", group = "message" },
    { regex = "Generating done", group = "message" },
    { regex = "Build succeeded", group = "message" },
]
failure = [
    { regex = "^CMake Error:", group = "message" },
    { regex = "CMake Error at", group = "message" },
    { regex = "Build failed", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
