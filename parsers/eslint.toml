name = "eslint"
description = "ESLint output parser"

[detection]
command_prefix = "eslint"

[detection.heuristic]
regex = "\\d+:\\d+\\s+(error|warning)\\s+"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
    "^prettier/prettier",
]

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error\\s+\\S+\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^\\s*(error|Error)\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^\\s*(warning|Warning)\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = []
failure = [
    { regex = "\\d+ error", group = "message" },
    { regex = "\\d+ warning", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
