name = "cargo"
description = "Cargo (Rust) build output parser"

[detection]
command_prefix = "cargo"

[detection.heuristic]
regex = "^(   Compiling|    Finished|error\\[)"
min_lines = 2

ignore_patterns = [
    "^\\s*$",
]

[[error_patterns]]
regex = "^error\\[E\\d+\\]:\\s*(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error\\[E\\d+\\]:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+error:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^error: could not compile .+$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^error: (?!could not compile)(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^warning: (?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^(?P<file>.+?):(?P<line>\\d+):(?P<column>\\d+):\\s+warning:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "Finished.*successfully", group = "message" },
    { regex = "Finished `[^`]+` profile", group = "message" },
]
failure = [
    { regex = "^error: could not compile", group = "message" },
    { regex = "^error: aborting", group = "message" },
]

[[test_patterns]]
# Cargo test summary line
# e.g. "test result: FAILED. 9 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out"
summary_regex = "test result:\\s*\\w+\\.\\s*(?P<passed>\\d+) passed;\\s*(?P<failures>\\d+) failed;\\s*(?P<skipped>\\d+) (?:ignored|skipped)"
# Individual test failures: e.g. "test test_bar ... FAILED"
failure_regex = "test\\s+(?P<suite>\\S+)\\s+\\.\\.\\.\\s+FAILED"

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
