name = "ansible"
description = "Ansible playbook output parser"

[detection]
command_prefix = "ansible"

[detection.heuristic]
regex = "^TASK \\[|^PLAY \\[|^PLAY RECAP|fatal: \\[|UNREACHABLE!|ok=\\d+"
min_lines = 2

ignore_patterns = [
    "^\\s*$",
    "^\\*+",
    "ok: \\[",
    "changed: \\[",
    "skipped: \\[",
]

[[error_patterns]]
regex = "^fatal:\\s+(?P<message>.+?): UNREACHABLE!"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^fatal:\\s+\\[.+?\\]: (?P<message>.+?)(?: =>|$)"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^(?P<message>.+?)FAILED! =>"
severity = "error"

[[error_patterns]]
regex = "^ERROR!\\s+(?P<message>.+)$"
severity = "error"

[[warning_patterns]]
regex = "^\\[WARNING\\]:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "PLAY RECAP", group = "message" },
    { regex = "ok=\\d+", group = "message" },
]
failure = [
    { regex = "^fatal:", group = "message" },
    { regex = "^ERROR!", group = "message" },
    { regex = "unreachable=[1-9]\\d*", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
