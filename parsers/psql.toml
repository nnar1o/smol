name = "psql"
description = "PostgreSQL CLI output parser"

[detection]
command_prefix = "psql"

[detection.heuristic]
regex = "FATAL:|could not connect to server|ERROR: .+ does not exist"
min_lines = 1

ignore_patterns = [
    "^\\s*$",
    "^[-+|]+$",
    "^SSL connection",
]

[[error_patterns]]
regex = "^psql:\\s+error:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^FATAL:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[error_patterns]]
regex = "^ERROR:\\s+(?P<message>.+)$"
severity = "error"

[[error_patterns]]
regex = "^could not connect to server:\\s+(?P<message>.+)$"
severity = "error"
is_fatal = true

[[warning_patterns]]
regex = "^WARNING:\\s+(?P<message>.+)$"
severity = "warning"

[[warning_patterns]]
regex = "^NOTICE:\\s+(?P<message>.+)$"
severity = "warning"

[status_patterns]
success = [
    { regex = "\\(\\d+ rows?\\)", group = "message" },
]
failure = [
    { regex = "^FATAL:", group = "message" },
    { regex = "^could not connect", group = "message" },
    { regex = "^psql: error:", group = "message" },
]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
