name = "my-custom-parser"

[detection]
command_prefix = "my-tool"

[detection.heuristic]
regex = "\\[MYTOOL\\]"
min_lines = 1

ignore_patterns = [
    "^\\[MYTOOL\\] DEBUG",
]

[[error_patterns]]
regex = "^\\[MYTOOL\\]\\s+ERROR:\\s+(?P<message>.*)$"
severity = "error"
is_fatal = true
group = "message"

[[warning_patterns]]
regex = "^\\[MYTOOL\\]\\s+WARN:\\s+(?P<message>.*)$"
severity = "warning"
group = "message"

[status_patterns]
success = [{ regex = "BUILD OK", group = "message" }]
failure = [{ regex = "BUILD FAILED", group = "message" }]

[summary]
max_errors = 3
max_warnings = 5
show_error_lines = true
